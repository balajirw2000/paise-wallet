services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paise
      POSTGRES_PASSWORD: paise
      POSTGRES_DB: paise_wallet
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paise -d paise_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/paise_wallet
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-production-32chars!!}
      PORT: 8080
      DEV_TOKENS_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/paise_wallet
      SPRING_DATASOURCE_USERNAME: paise
      SPRING_DATASOURCE_PASSWORD: paise
    depends_on:
      postgres:
        condition: service_healthy
